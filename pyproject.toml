[project]
name = "swe-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Inderjeetkaur747", email = "inderjeetkaur587@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=1.9,<2",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "qdrant-client>=1.20.0",
    "rich>=15.0.0",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
swe-agent = "swe_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the real embedding model (set RUN_SLOW=1)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
